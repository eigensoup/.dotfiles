# pnpm's user-level credentials, linked to ~/Library/Preferences/pnpm/auth.ini by
# `es install`. pnpm expands ${...} here wherever it runs. It refuses to expand it
# from a .npmrc it takes for a project's own, which is what ~/.npmrc is when pnpm
# runs in ~. No secret here: the token comes from the macOS Keychain via .zshrc.
//npm.pkg.github.com/:_authToken=${KRV_PACKAGES_TOKEN}
